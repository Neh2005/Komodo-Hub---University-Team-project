name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master   # change if your default branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Komodo-Hub---University-Team-project
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0 — pinned, not the mutable v3 tag (semgrep: github-actions-mutable-action-tag)

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1 — pinned, not the mutable v3 tag (semgrep: github-actions-mutable-action-tag)
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Block console.log from reaching production (data-leak guard)
        run: |
          if grep -rn "console\.log(" src/; then
            echo "console.log() found in src/ above. This project previously leaked full user objects, UIDs, and Firestore paths through debug logs — remove this call, or use console.warn/console.error if it's genuinely needed."
            exit 1
          fi

      - name: Build project
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Legacy `firebase login:ci` tokens (--token) are being phased out by Google and
      # are now being rejected outright (401 on firebaserules.googleapis.com) rather than
      # just deprecated. This authenticates via a service account key instead, which sets
      # GOOGLE_APPLICATION_CREDENTIALS — firebase-tools picks that up automatically, so the
      # deploy step below needs no --token at all. One-time setup: create a service account
      # with the "Firebase Admin" role in Google Cloud Console for this project, download
      # its JSON key, and store the whole file's contents as the FIREBASE_SERVICE_ACCOUNT
      # repo secret (Settings -> Secrets and variables -> Actions).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting, Firestore rules and indexes
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes

